/*@FONTS@*/

/* ── Grundlagen ───────────────────────────────────────────── */
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{
  background:#0F1110;color:#F1F0EC;
  font-family:Barlow,system-ui,-apple-system,sans-serif;
  -webkit-tap-highlight-color:transparent;
  -webkit-text-size-adjust:100%;
  overscroll-behavior:none;
  touch-action:manipulation;
  user-select:none;-webkit-user-select:none;
}
#app{
  position:fixed;inset:0;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
  overflow:hidden;
}
.scroll{flex:1;overflow-y:auto;min-height:0;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.scroll::-webkit-scrollbar{width:0;height:0}

/* ── Typografie ───────────────────────────────────────────── */
.cd{font-family:'Barlow Condensed',Barlow,system-ui,sans-serif}
.kick{font-family:'Barlow Condensed',Barlow,sans-serif;font-weight:700;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:rgba(241,240,236,.45)}
.kick-a{color:#FF4D17}
.num{font-variant-numeric:tabular-nums}

/* ── Tap-Feedback (ersetzt style-hover/style-active des Prototyps) ── */
.tap{cursor:pointer;user-select:none;-webkit-user-select:none}
.tap:active{opacity:.72}
.press:active{transform:scale(.985)}
.ring:active{background:rgba(255,255,255,.08)!important;opacity:1}

/* ── Bausteine ────────────────────────────────────────────── */
.card{background:#191C19;border:1px solid rgba(255,255,255,.08);border-radius:20px}
.primary{
  border-radius:18px;background:#FF4D17;display:flex;align-items:center;justify-content:center;
}
.primary span{font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.1em;color:#0F1110}
.stepper{
  flex:none;display:flex;align-items:center;justify-content:center;position:relative;
  border:1px solid rgba(255,255,255,.18);
}
.bar-h{width:30px;height:4px;border-radius:2px;background:#F1F0EC}
.bar-v{width:4px;height:30px;border-radius:2px;background:#F1F0EC;position:absolute}

"use strict";
/* ════════════════════════════════════════════════════════════
   GRUNDFORM — Calisthenics-Trainingsplan, local-first.
   Portiert aus dem Claude-Design-Prototyp (Grundform.dc.html).
   Kein Server, kein Account: der gesamte Zustand liegt in
   localStorage auf dem Gerät.
   ════════════════════════════════════════════════════════════ */

const ACCENT = '#FF4D17';
const STORE  = 'grundform.session.v2';
const HISTORY_MAX = 200; // ~ zwei Jahre bei 2x/Woche, genug für den Verlauf

/* ── Übungsdatenbank ──────────────────────────────────────────

   bewusst — dort steht Calisthenics.
   `pattern` steuert, welche Alternativen beim Tauschen

  { id:'curl-band',     name:'Expander-Curl',           short:'Exp. Curl',     pattern:'arm',   label:'Armbeuger',          equip:'Expander',            kind:'bw',   unit:'Wiederholungen', cue:'Ellbogen bleibt am Rumpf',          rest:45,  lvl:1 },

const byId = id => DB.find(e => e.id === id);

/* ── Die vier Einheiten ───────────────────────────────────────
   Rotation statt Wochentage: Ober A → Unter A → Ober B →
   Unter B → Ober A. Es zählt die Reihenfolge, nicht der
   Kalender. Nichts wird nachgeholt.
   `role` ist die Ausführungsform: die erste Übung einzeln, der
   Rest in Antagonisten-Supersätzen. `lo`/`hi` ist der
   Wdh-Zielbereich, `reps` das aktuelle Ziel darin.
   `short` sind die drei Übungen der Kurzversion.
   `warm` sind die Aufwärm-Schritte. `for` bindet einen Schritt an
   eine Übung – ist sie gestrichen, entfällt der Schritt. `ramp`
   rechnet die aktuelle Arbeitslast dieser Übung in den Text
   ein, statt ein Gewicht fest zu verdrahten. ---------------- */
const SESSIONS = [
  { id:'oberA', name:'OBER A', kick:'Oberkörper · Zug zuerst', mins:28, shortMins:16,

      { text:'10 Hüftheben zweibeinig, dann 10 Hüftkreise je Seite' },

      { text:'20 s toter Hang zur Vorbereitung des Kniehebens', for:'core-hang-knee' },

      { exId:'chinup',        role:'einzeln',      sets:5, lo:4,  hi:6,  reps:4,  w:0,  prog:'reps' },

const freshPlans = () => SESSIONS.map(s => s.slots.map(x => ({ ...x })));

/* ── Zustand ──────────────────────────────────────────────────
   `rot` ist die Position in der Rotation, `plans` hält die
   angepassten Slots aller vier Einheiten. ------------------- */
let S = {
  tab:'heute', rot:0, live:null, sheet:null, draft:null, pick:null,
  plans: freshPlans(), history:[],
};
const sess      = () => SESSIONS[S.rot];
const curSlots  = () => S.plans[S.rot];
const nextSess  = () => SESSIONS[(S.rot + 1) % SESSIONS.length];
let timer = null;
let wakeLock = null;
const scrollMemo = {};

function screenKey(){ return S.live ? 'live' : S.tab; }

function persist(){
  try {
    localStorage.setItem(STORE, JSON.stringify({ tab:S.tab, rot:S.rot, live:S.live, plans:S.plans, pick:S.pick, history:S.history }));
  } catch(e){}
}
function restore(){
  try {
    const raw = localStorage.getItem(STORE);
    if (!raw) return;
    const s = JSON.parse(raw);
    if (!s) return;
    S.tab   = s.tab || 'heute';
    S.rot   = (typeof s.rot === 'number' && s.rot >= 0 && s.rot < SESSIONS.length) ? s.rot : 0;
    S.plans = (Array.isArray(s.plans) && s.plans.length === SESSIONS.length
               && s.plans.every(p => Array.isArray(p) && p.length))
              ? s.plans : freshPlans();
    S.pick  = Array.isArray(s.pick) && s.pick.length
              ? s.pick.filter(i => Number.isInteger(i) && i >= 0 && i < S.plans[S.rot].length)
              : null;
    S.history = Array.isArray(s.history) ? s.history.slice(-HISTORY_MAX) : [];
    S.live  = s.live || null;
    /* Einheit von vor dem Aufwärm-Update: kein `phase` gespeichert.
       Nicht ins Aufwärmen zurückwerfen. */
    if (S.live && !S.live.phase) { S.live.phase = 'work'; S.live.warm = S.live.warm || []; }
    if (S.live && S.live.resting) {
      // Pause läuft nach Wall-Clock weiter – auch wenn Android die App
      // zwischendurch eingefroren oder der Nutzer neu geladen hat.
      const left = Math.ceil(((S.live.restEnd || 0) - Date.now()) / 1000);
      if (left > 0) { S.live.rest = left; startTimer(); }
      else { S.live.resting = false; S.live.rest = 0; }
    }
  } catch(e){}
}

function set(patch){
  Object.assign(S, patch);
  persist();
  render();
}

/* ── Bildschirm wachhalten + Haptik ───────────────────────── */
async function acquireWakeLock(){
  try {
    if ('wakeLock' in navigator && !wakeLock) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    }
  } catch(e){}
}
function releaseWakeLock(){
  try { if (wakeLock) { wakeLock.release(); wakeLock = null; } } catch(e){}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    if (S.live) acquireWakeLock();
    if (S.live && S.live.resting) tick();   // nach dem Aufwachen sofort korrigieren
  }
});
function buzz(p){ try { navigator.vibrate && navigator.vibrate(p); } catch(e){} }

/* ── Ableitungen ──────────────────────────────────────────── */
const num = v => String(v).replace('.', ',');
const range = s => (s.lo === s.hi ? String(s.lo) : s.lo + '–' + s.hi);

function slotView(s){
  const ex = byId(s.exId);
  const load = ex.kind === 'load'
    ? num(s.w) + ' kg'
    : (s.w > 0 ? '+' + num(s.w) + ' kg Rucksack' : 'Körpergewicht');
  return {
    ...ex, sets:s.sets, target:s.reps, lo:s.lo, hi:s.hi, w:s.w, prog:s.prog, role:s.role,
    scheme: s.sets + ' × ' + range(s) +
            (ex.kind === 'load' ? ' · ' + num(s.w) + ' kg' : (s.w > 0 ? ' · +' + num(s.w) + ' kg' : '')),
    detail: load + ' · ' + ex.cue,
  };
}
/* `slotIdx` ist der Index der Übung in der Einheit – nicht im
   Live-Plan. Nur damit findet die Progression nach einer
   gekürzten Einheit die richtige Übung wieder. */
function buildPlan(idx){
  const sl = curSlots();
  return idx.map(i => ({ ...slotView(sl[i]), slotIdx:i }));
}
/* Gewählte Übungen der nächsten Einheit, Default alle. */
function pickIdx(){
  const n = curSlots().length;
  const p = (S.pick || []).filter(i => i >= 0 && i < n);
  return p.length ? [...p].sort((a, b) => a - b) : curSlots().map((_, i) => i);
}
const sameIdx = (a, b) => a.length === b.length && a.every((x, i) => x === b[i]);
const setsOf  = idx => idx.reduce((a, i) => a + curSlots()[i].sets, 0);

/* Zeitbudget: die dokumentierten Werte für die volle Einheit und
   die Kurzversion stehen fest, freie Auswahl wird über die
   Satzzahl geschätzt. */
function estMins(idx){
  const se = sess(), all = curSlots().map((_, i) => i);
  if (sameIdx(idx, all))              return se.mins;
  if (sameIdx(idx, [...se.short].sort((a, b) => a - b))) return se.shortMins;
  return 5 + Math.round((se.mins - 5) * setsOf(idx) / Math.max(1, setsOf(all)));
}
/* Echter Meilenstein einer Übung: wo im Zielbereich sie steht und
   was als nächstes ansteht. Ersetzt die früher fest verdrahteten
   Ladder-/Chart-Daten – dieselbe Logik wie der „auto"-Hinweis auf
   dem Heute-Screen, nur für die Kachel-Darstellung. */
function milestoneOf(slot){
  const ex = byId(slot.exId);
  if (slot.reps < slot.hi) {
    return {
      name: ex.name,
      big: slot.reps + ' von ' + slot.hi,
      sub: 'noch ' + (slot.hi - slot.reps) + ' Wdh bis zur nächsten Stufe',
      pct: Math.round((slot.reps - slot.lo) / Math.max(1, slot.hi - slot.lo) * 100),
    };
  }
  const nx = ex.next ? byId(ex.next) : null;
  return {
    name: ex.name,
    big: ex.kind === 'load' ? num(slot.w) + ' kg' : slot.reps + ' Wdh',
    sub: slot.prog === 'weight' ? 'nächste Einheit +' + num(ex.step || 2.5) + ' kg'
         : nx ? 'nächste Einheit: ' + nx.name
         : 'Bereich ausgereizt',
    pct: 100,
  };
}

/* Verlaufseintrag beim Abschluss einer Einheit. Übungen werden per
   `exId` statt Plan-/Slot-Index gespeichert – der Verlauf muss auch
   dann lesbar bleiben, wenn sich der Katalog später ändert. */
function historyEntry(l){
  const skipped = new Set(l.skipped || []);
  const exs = l.plan.map((p, i) => {
    if (skipped.has(i)) return null;
    const reps = l.log.filter(x => x.ex === i).map(x => x.reps);
    if (!reps.length) return null;
    return { short:p.short, kind:p.kind, w:p.w, reps, slotIdx:p.slotIdx };
  }).filter(Boolean);
  return {
    ts: Date.now(), session: sess().name,
    doneSets: l.log.length, totalSets: l.plan.reduce((a, p) => a + p.sets, 0),
    exCount: exs.length, planCount: l.plan.length,
    skipped: [...skipped].map(i => l.plan[i].short),
    anchor: exs.find(e => e.slotIdx === 0) || null,
  };
}

/* ── Aufwärmen ────────────────────────────────────────────────
   Aufbausätze werden aus der heutigen Arbeitslast gerechnet, nicht
   fest hinterlegt: Langhantel 65 % (auf 2,5 kg), Kurzhantel 45 %
   (auf 2 kg). Das reproduziert die Werte aus dem Trainingsplan
   (60→40, 40→25, 18→8) und bleibt korrekt, wenn die Progression
   die Lasten verschiebt. Landet der Aufbausatz auf oder unter dem
   Stangengewicht, entfällt er – die leere Stange steht schon im
   Schritt-Text. */
const BAR_KG = 20;
function rampLoad(plan, exId){
  /* Plan-Einträge kommen aus slotView() und tragen die Katalog-`id`,
     nicht `exId`. */
  const p = plan.find(x => x.id === exId);
  if (!p || p.kind !== 'load' || !p.w) return null;
  const bar = /Langhantel/.test(p.equip);
  const grid = bar ? 2.5 : 2;
  const val  = Math.round(p.w * (bar ? 0.65 : 0.45) / grid) * grid;
  if (bar && val <= BAR_KG) return null;
  if (!val) return null;
  return bar ? num(val) + ' kg' : '2 × ' + num(val) + ' kg';
}

/* Aufwärm-Schritte für den tatsächlich gewählten Plan. Schritte zu
   gestrichenen Übungen fallen weg. */
function buildWarm(plan){
  const steps = sess().warm || [];
  return steps.map(s => {
    const link = s.for || s.ramp;
    if (link && !plan.some(p => p.id === link)) return null;
    if (!s.ramp) return { text:s.text, done:false };
    const r = rampLoad(plan, s.ramp);
    return { text: s.text + (r ? (s.join || ', dann 5 Wdh mit ') + r : ''), done:false };
  }).filter(Boolean);
}

/* ── Training ─────────────────────────────────────────────── */
function startTimer(){
  clearInterval(timer);
  timer = setInterval(tick, 250);
}
function tick(){
  if (!S.live || !S.live.resting) { clearInterval(timer); return; }
  const left = Math.ceil((S.live.restEnd - Date.now()) / 1000);
  if (left <= 0) {
    clearInterval(timer);
    S.live.resting = false; S.live.rest = 0;
    buzz([90, 70, 90]);
    persist(); render();
    return;
  }
  if (left !== S.live.rest) { S.live.rest = left; render(); }
}

const A = {
  goHeute:       () => set({ tab:'heute' }),
  goPlan:        () => set({ tab:'plan' }),
  goFortschritt: () => set({ tab:'fortschritt' }),

  startFull:  () => start(pickIdx(), false),
  startShort: () => { S.pick = null; start([...sess().short].sort((a, b) => a - b), true); },

  /* Übung für heute streichen bzw. zurückholen. Die letzte
     verbleibende lässt sich nicht abwählen. */
  togglePick: i => {
    const cur = pickIdx();
    const next = cur.includes(i) ? cur.filter(k => k !== i) : [...cur, i].sort((a, b) => a - b);
    if (!next.length) return;
    buzz(15);
    set({ pick: next });
  },

  tapEx:   i => set({ sheet:{ type:'swap', i } }),
  tapLoad: i => set({ sheet:{ type:'load', i }, draft:{ ...curSlots()[i] } }),
  closeSheet: () => set({ sheet:null, draft:null }),

  /* Rotation von Hand setzen – z. B. wenn eine Einheit im Garten
     an der Reihenfolge vorbei gelaufen ist. */
  pickRot: i => set({ tab:'heute', rot:i, pick:null }),

  pickEx: id => {
    const i = S.sheet.i, ex = byId(id);
    const slots = curSlots().map((s, k) => {
      if (k !== i) return s;
      const w = ex.kind === 'load' ? (ex.w || 0) : 0;
      return { ...s, exId:id, reps:s.lo, w, prog: ex.kind === 'load' ? 'weight' : 'reps' };
    });
    set({ plans: S.plans.map((p, k) => (k === S.rot ? slots : p)), sheet:null, draft:null });
  },

  wUp:       () => draftBump('w',    draftStep(),  0),
  wDown:     () => draftBump('w',   -draftStep(),  0),
  setsUp:    () => draftBump('sets',  1, 1),
  setsDown:  () => draftBump('sets', -1, 1),
  repsUp:    () => draftBump('reps',  1, 1),
  repsDown:  () => draftBump('reps', -1, 1),
  setProgWeight: () => set({ draft:{ ...S.draft, prog:'weight' } }),
  setProgReps:   () => set({ draft:{ ...S.draft, prog:'reps'   } }),
  applyDraft: () => {
    const i = S.sheet.i, d = S.draft;
    const slots = curSlots().map((x, k) => (k === i ? { ...d } : x));
    set({ plans: S.plans.map((p, k) => (k === S.rot ? slots : p)), sheet:null, draft:null });
  },

  inc: () => bump(1),
  dec: () => bump(-1),

  /* Aufwärmen: Abhaken ist Gedächtnisstütze, keine Pflicht – „Los"
     geht auch mit offenen Schritten. */
  warmToggle: i => {
    const warm = S.live.warm.map((w, k) => (k === i ? { ...w, done: !w.done } : w));
    buzz(15);
    set({ live:{ ...S.live, warm } });
  },
  warmGo: () => { buzz(20); set({ live:{ ...S.live, phase:'work' } }); },

  completeSet, skipRest, skipEx, endHere, abort, finish,
};

function draftStep(){ const dex = byId(S.draft.exId); return dex.step || 1; }
function draftBump(key, d, min){
  S.draft = { ...S.draft, [key]: Math.max(min, Math.round((S.draft[key] + d) * 10) / 10) };
  set({});
}

function start(idx, short){
  clearInterval(timer);
  const plan = buildPlan(idx);
  const warm = buildWarm(plan);
  acquireWakeLock();
  buzz(20);
  set({ live:{ plan, short, mins: estMins(idx), phase: warm.length ? 'warm' : 'work', warm,
               ex:0, set:0, reps:plan[0].target,
               resting:false, rest:0, restMax:1, restEnd:0, done:false, log:[], skipped:[] } });
}

function abort(){
  clearInterval(timer); releaseWakeLock();
  set({ live:null, pick:null });
}

/* Doppelte Progression: erst Wiederholungen im Zielbereich hoch,
   am oberen Ende dann Gewicht bzw. Last-Variante – und im Bereich
   unten wieder einsteigen. Gilt je Übung: was vollständig
   durchgezogen wurde, steigert – auch an gekürzten Tagen.
   Gestrichene Übungen bleiben stehen. */
function progress(slot, reached){
  if (!reached) return slot;
  const ex = byId(slot.exId);
  if (slot.reps < slot.hi) return { ...slot, reps: slot.reps + 1 };

  if (slot.prog === 'weight')
    return { ...slot, w: Math.round((slot.w + (ex.step || 2.5)) * 10) / 10, reps: slot.lo };

  /* Körpergewicht am oberen Ende: auf die dokumentierte nächste
     Stufe wechseln – schwerere Variante oder Zusatzlast – und im
     Bereich unten wieder einsteigen. Ohne nächste Stufe bleibt
     der Bereich stehen. */
  const nx = ex.next ? byId(ex.next) : null;
  if (!nx) return slot;
  return { ...slot, exId:nx.id, w: nx.w || 0, reps: slot.lo,
           prog: nx.kind === 'load' ? 'weight' : 'reps' };
}

/* Zuordnung Protokoll → Übung der Einheit. `slotIdx` fehlt nur in
   einer Einheit, die vor diesem Update schon lief – dann greift
   der Plan-Index wie früher. */
const logSlot = (x, plan) =>
  (x.slotIdx !== undefined ? x.slotIdx
   : (plan && plan[x.ex] && plan[x.ex].slotIdx !== undefined) ? plan[x.ex].slotIdx : x.ex);

function finish(){
  clearInterval(timer); releaseWakeLock();
  const l = S.live;
  const slots = curSlots().map((slot, i) => {
    if (!l) return slot;
    const hit = l.log.filter(x => logSlot(x, l.plan) === i);
    return progress(slot, hit.length === slot.sets && hit.every(x => x.reps >= slot.reps));
  });
  const history = l ? [...S.history, historyEntry(l)].slice(-HISTORY_MAX) : S.history;
  set({
    live:null, tab:'fortschritt', pick:null, history,
    plans: S.plans.map((p, k) => (k === S.rot ? slots : p)),
    rot: (S.rot + 1) % SESSIONS.length,
  });
}

function bump(d){
  S.live.reps = Math.max(0, S.live.reps + d);
  set({});
}

function completeSet(){
  const l = S.live; if (!l) return;
  const ex = l.plan[l.ex];
  const log = [...l.log, { ex:l.ex, slotIdx:ex.slotIdx, set:l.set, reps:l.reps }];
  const lastSet = l.set + 1 >= ex.sets;
  const lastEx  = l.ex  + 1 >= l.plan.length;
  buzz(35);

  if (lastSet && lastEx) {
    clearInterval(timer); releaseWakeLock();
    set({ live:{ ...l, log, done:true, resting:false } });
    return;
  }
  const nx   = lastSet ? { ex:l.ex + 1, set:0 } : { ex:l.ex, set:l.set + 1 };
  const rest = ex.rest;
  startTimer();
  set({ live:{ ...l, log, ...nx, reps: l.plan[nx.ex].target,
               resting:true, rest, restMax:rest, restEnd: Date.now() + rest * 1000 } });
}

/* Übung streichen und zur nächsten springen. Angefangene Sätze
   bleiben im Protokoll, die Übung steigert dann nur nicht. */
function skipEx(){
  const l = S.live; if (!l || l.done) return;
  clearInterval(timer);
  const skipped = [...(l.skipped || []), l.ex];
  buzz(20);
  if (l.ex + 1 >= l.plan.length) {
    releaseWakeLock();
    set({ live:{ ...l, skipped, done:true, resting:false, rest:0, restEnd:0 } });
    return;
  }
  set({ live:{ ...l, skipped, ex:l.ex + 1, set:0, reps: l.plan[l.ex + 1].target,
               resting:false, rest:0, restEnd:0 } });
}

/* Einheit hier beenden: der Rest fällt weg, das Protokoll bleibt.
   Anders als Abbrechen zählt die Einheit und die Rotation rückt vor. */
function endHere(){
  const l = S.live; if (!l || l.done) return;
  clearInterval(timer); releaseWakeLock();
  const rest = l.plan.map((_, i) => i).filter(i => i >= l.ex);
  buzz(35);
  set({ live:{ ...l, skipped: [...new Set([...(l.skipped || []), ...rest])],
               done:true, resting:false, rest:0, restEnd:0 } });
}

function skipRest(){
  clearInterval(timer);
  set({ live:{ ...S.live, resting:false, rest:0, restEnd:0 } });
}

function viewPlan(){
  return `
<div style="padding:14px 22px 28px">

  <div style="font:500 15px/1.45 Barlow,sans-serif;color:rgba(241,240,236,.55);margin-top:8px;max-width:320px">Keine Wochentage. Bei 3–4 Einheiten pro Woche dauert ein Durchlauf 7–9 Tage.</div>

  <div style="display:flex;flex-direction:column;gap:12px;margin-top:24px">
    ${SESSIONS.map((s, i) => {
      const on   = i === S.rot;
      const sl   = S.plans[i];
      const list = sl.map(x => byId(x.exId).short).join(' · ');
      const kurz = s.short.map(k => byId(sl[k].exId).short).join(' · ');
      return `
    <div class="tap" ${act('pickRot', i)} style="background:#191C19;border:1px solid ${on ? 'rgba(255,77,23,.5)' : 'rgba(255,255,255,.08)'};border-radius:18px;padding:18px 20px">
      <div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px">
        <div class="cd" style="font-weight:700;font-size:26px;line-height:1;color:${on ? '#F1F0EC' : 'rgba(241,240,236,.7)'}">${s.name}</div>
        <div class="cd" style="font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:${on ? ACCENT : 'rgba(241,240,236,.35)'};white-space:nowrap">${on ? 'Als nächstes' : 'Position ' + (i + 1)}</div>
      </div>
      <div style="font:500 13.5px/1.4 Barlow,sans-serif;color:rgba(241,240,236,.5);margin-top:6px">${list}</div>
      <div style="display:flex;gap:12px;margin-top:10px">
        <div style="flex:none;white-space:nowrap;font:500 12.5px Barlow,sans-serif;color:rgba(241,240,236,.45)">ca. ${s.mins} min</div>
        <div style="flex:1;min-width:0;font:500 12.5px/1.35 Barlow,sans-serif;color:rgba(241,240,236,.35)">Kurz ${s.shortMins} min: ${kurz}</div>
      </div>
    </div>`;
    }).join('')}
  </div>

  <div style="margin-top:22px;padding:16px 18px;border-radius:16px;background:rgba(255,77,23,.09);border:1px solid rgba(255,77,23,.22)">
    <div style="font:500 14px/1.5 Barlow,sans-serif;color:rgba(241,240,236,.8)">Termin geplatzt? Die nächste Einheit ist trotzdem die nächste in dieser Liste – nichts wird nachgeholt. Einheit antippen, um die Position von Hand zu setzen.</div>
  </div>

  <div class="kick" style="margin-top:28px">Aufbau jeder Einheit</div>
  <div style="font:500 14px/1.5 Barlow,sans-serif;color:rgba(241,240,236,.5);margin-top:8px">Übung 1 einzeln und frisch, danach zwei Antagonisten-Supersätze. 1–2 Wiederholungen bleiben immer im Tank – kein Satz bis zum Versagen.</div>
</div>`;
}

    <div class="cd" style="font-weight:700;font-size:44px;line-height:1;color:#0F1110;margin-top:6px">${next.m.big}</div>

    <div style="height:8px;border-radius:4px;background:rgba(15,17,16,.22);margin-top:14px;overflow:hidden">

  <div class="kick" style="margin-top:30px">Aktueller Stand · alle Einheiten</div>

      <div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px">
        <div class="cd" style="font-weight:700;font-size:16px">${s.name}</div>
        <div class="cd" style="font-weight:700;font-size:20px;white-space:nowrap">${m.big}</div>

      <div style="font:500 13px/1.4 Barlow,sans-serif;color:rgba(241,240,236,.5);margin-top:4px">${h.doneSets} von ${h.totalSets} Sätzen · ${h.exCount} von ${h.planCount} Übungen${h.skipped.length ? ' · gestrichen: ' + h.skipped.join(', ') : ''}</div>
      ${h.anchor ? `<div style="font:500 13px Barlow,sans-serif;color:rgba(241,240,236,.65);margin-top:6px">${h.anchor.short}: ${h.anchor.kind === 'load' ? num(h.anchor.w) + ' kg · ' : ''}${h.anchor.reps.join(' · ')} Wdh</div>` : ''}

function viewTabs(){
  const pill = (on) => on ? 'rgba(255,77,23,.18)' : 'transparent';
  const col  = (on) => on ? '#F1F0EC' : 'rgba(241,240,236,.4)';
  const tab = (name, label, action) => `
    <div class="tap" ${act(action)} style="flex:1;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;background:${pill(S.tab === name)}">
      <span class="cd" style="font-weight:700;font-size:16px;letter-spacing:.14em;text-transform:uppercase;color:${col(S.tab === name)}">${label}</span>
    </div>`;
  return `
<div style="flex:none;display:flex;align-items:center;gap:6px;border-top:1px solid rgba(255,255,255,.09);background:#141614;padding:10px 12px 12px">
  ${tab('heute','Heute','goHeute')}
  ${tab('plan','Plan','goPlan')}
  ${tab('fortschritt','Fortschritt','goFortschritt')}
</div>`;
}

function viewLive(){
  const live = S.live, plan = live.plan, ex = plan[live.ex];
  const totalSets = plan.reduce((a, e) => a + e.sets, 0);
  const doneSets  = live.log.length;

  const skipped = live.skipped || [];
  const segs = plan.map((e, i) => {
    const color = skipped.includes(i) ? 'rgba(255,255,255,.3)'
      : i < live.ex ? ACCENT
      : (i === live.ex && !live.done) ? 'rgba(255,77,23,.35)'
      : live.done ? 'rgba(255,255,255,.11)' : 'rgba(255,255,255,.11)';
    return `<div style="flex:${e.sets};height:4px;border-radius:2px;background:${color}"></div>`;
  }).join('');

  const warming = live.phase === 'warm';
  const lastEx = live.ex + 1 >= plan.length;
  const cutStyle = 'font-weight:600;font-size:13px;letter-spacing:.13em;text-transform:uppercase;color:rgba(241,240,236,.38);padding:6px 0';
  const cut = live.done ? '' : warming ? `
  <div style="display:flex;align-items:center;justify-content:flex-end;margin-top:10px">
    <div class="tap cd" ${act('warmGo')} style="${cutStyle}">Aufwärmen überspringen</div>
  </div>` : `
  <div style="display:flex;align-items:center;justify-content:space-between;margin-top:10px">
    ${lastEx ? '<div></div>' : `<div class="tap cd" ${act('skipEx')} style="${cutStyle}">Übung überspringen</div>`}
    <div class="tap cd" ${act('endHere')} style="${cutStyle}">Einheit beenden</div>
  </div>`;

  const header = `
<div style="flex:none;padding:10px 22px 0">
  <div style="display:flex;align-items:center;justify-content:space-between">
    <div class="tap cd" ${act('abort')} style="font-weight:600;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:rgba(241,240,236,.4);padding:6px 0">Abbrechen</div>
    <div class="cd" style="font-weight:700;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:rgba(241,240,236,.4)">${sess().name}${live.short ? ' · Kurz' : ''}</div>
  </div>
  <div style="display:flex;gap:5px;margin-top:12px">${segs}</div>
  ${cut}
</div>`;

  let body;
  if (warming && !live.done) {
    const warm = live.warm || [];
    const offen = warm.filter(w => !w.done).length;
    body = `
<div style="flex:1;display:flex;flex-direction:column;padding:0 22px 14px;min-height:0">
  <div style="padding-top:24px;flex:none">
    <div class="cd kick-a" style="font-weight:700;font-size:13px;letter-spacing:.2em;text-transform:uppercase">Aufwärmen · ${sess().name}</div>
    <div class="cd" style="font-weight:700;font-size:40px;line-height:1;margin-top:6px">${warm.length} SCHRITTE</div>
    <div style="font:500 14px/1.4 Barlow,sans-serif;color:rgba(241,240,236,.5);margin-top:6px">ca. 5 min · zählt nicht als Satz</div>
  </div>

  <div class="scroll" data-key="live" style="flex:1;min-height:0;margin-top:18px">
    ${warm.map((w, i) => `
    <div class="tap" ${act('warmToggle', i)} style="display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.055)">
      <div style="flex:none;width:26px;height:26px;margin-top:1px;border-radius:13px;border:2px solid ${w.done ? ACCENT : 'rgba(255,255,255,.22)'};background:${w.done ? ACCENT : 'transparent'};display:flex;align-items:center;justify-content:center">
        ${w.done ? '<div style="width:10px;height:10px;border-radius:5px;background:#0F1110"></div>' : ''}
      </div>
      <div style="flex:1;min-width:0;font:500 16px/1.4 Barlow,sans-serif;color:${w.done ? 'rgba(241,240,236,.34)' : '#F1F0EC'};${w.done ? 'text-decoration:line-through' : ''}">${w.text}</div>
    </div>`).join('')}
  </div>

  <div class="tap press primary" ${act('warmGo')} style="height:82px;border-radius:20px;flex:none;margin-top:14px">
    <span style="font-size:28px">${offen ? 'LOS' : 'AUFWÄRMEN FERTIG'}</span>
  </div>
</div>`;
  } else if (live.done) {
    const base    = live.mins || sess().mins;
    const doneMin = Math.max(5, 5 + Math.round((base - 5) * doneSets / Math.max(1, totalSets)));

    /* Gestrichenes offen benennen – sonst liest sich eine halbe
       Einheit wie eine ganze. */
    const cutNames = skipped.map(i => plan[i].short);
    const summary = doneSets + ' von ' + totalSets + ' Sätzen · '
      + (plan.length - skipped.length) + ' von ' + plan.length + ' Übungen'
      + (cutNames.length ? ' · gestrichen: ' + cutNames.join(', ') : '')
      + ' · als nächstes ' + nextSess().name;

    /* Meilenstein-Zeile für die erste vollständig gemachte Übung. */
    const iDone = plan.findIndex((e, i) =>
      live.log.filter(x => x.ex === i).length === e.sets);
    let milestone = 'Nichts vollständig durchgezogen · Lasten bleiben, wo sie sind';
    if (iDone >= 0) {
      const p   = plan[iDone];
      const got = live.log.filter(x => x.ex === iDone).map(x => x.reps);
      const low = Math.min(...got);
      const nx  = p.next ? byId(p.next) : null;
      milestone = p.short + ': ' + got.join(' · ') + (
          low < p.target        ? ' — Ziel ' + p.target + ' Wdh, Bereich ' + p.lo + '–' + p.hi
          : low < p.hi          ? ' — nächste Einheit ' + (p.target + 1) + ' Wdh'
          : p.prog === 'weight' ? ' — Bereich oben, nächste Einheit schwerer'
          : nx                  ? ' — Bereich oben, nächste Stufe: ' + nx.name
                                : ' — Bereich oben');
    }
    body = `
<div style="flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 26px 40px;overflow-y:auto">
  <div class="cd kick-a" style="font-weight:700;font-size:13px;letter-spacing:.2em;text-transform:uppercase">Einheit abgeschlossen</div>
  <div class="cd" style="font-weight:700;font-size:76px;line-height:.92;margin-top:10px">${doneMin}<span style="font-size:38px"> min</span></div>
  <div style="font:500 16px/1.5 Barlow,sans-serif;color:rgba(241,240,236,.55);margin-top:10px">${summary}</div>
  <div class="card" style="margin-top:28px;padding:20px;border-radius:18px">
    <div class="kick">Meilenstein</div>
    <div class="cd" style="font-weight:700;font-size:30px;line-height:1.05;margin-top:6px">${milestone}</div>
  </div>
  <div class="tap press primary" ${act('finish')} style="height:74px;margin-top:26px">
    <span style="font-size:26px">FERTIG</span>
  </div>
</div>`;
  } else if (live.resting) {
    const m = Math.floor(live.rest / 60), s = live.rest % 60;
    const clock = m + ':' + String(s).padStart(2, '0');
    const pct = Math.round((live.rest / Math.max(1, live.restMax)) * 100) + '%';
    body = `
<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px 26px 16px;min-height:0">
  <div class="cd" style="font-weight:700;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:rgba(241,240,236,.4)">Pause</div>
  <div class="cd num" style="font-weight:700;font-size:min(140px,32vw);line-height:.9;letter-spacing:-.02em;margin-top:8px">${clock}</div>
  <div style="width:100%;height:6px;border-radius:3px;background:rgba(255,255,255,.1);margin-top:18px;overflow:hidden">
    <div style="height:100%;background:${ACCENT};border-radius:3px;width:${pct}"></div>
  </div>
  <div style="margin-top:34px;text-align:center">
    <div class="cd" style="font-weight:700;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:rgba(241,240,236,.4)">Als nächstes</div>
    <div class="cd" style="font-weight:700;font-size:30px;line-height:1.1;margin-top:6px">${ex.short}</div>
    <div style="font:500 15px Barlow,sans-serif;color:rgba(241,240,236,.5);margin-top:4px">Satz ${live.set + 1} · Ziel ${ex.target} Wdh</div>
  </div>
  <div class="tap press" ${act('skipRest')} style="width:100%;height:74px;border-radius:18px;border:1px solid rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;margin-top:auto;flex:none">
    <span class="cd" style="font-weight:700;font-size:24px;letter-spacing:.1em;color:rgba(241,240,236,.8)">WEITER</span>
  </div>
</div>`;
  } else {
    const chips = Array.from({ length: ex.sets }, (_, i) => {
      const rec = live.log.find(l => l.ex === live.ex && l.set === i);
      let c;
      if (rec)                 c = { label:String(rec.reps), bg:'rgba(255,77,23,.16)', border:'rgba(255,77,23,.4)',  color:ACCENT };
      else if (i === live.set) c = { label:'–', bg:'rgba(255,255,255,.06)', border:'rgba(255,255,255,.28)', color:'#F1F0EC' };
      else                     c = { label:'–', bg:'transparent',           border:'rgba(255,255,255,.1)',  color:'rgba(241,240,236,.3)' };
      return `<div style="flex:1;height:44px;border-radius:12px;background:${c.bg};border:1px solid ${c.border};display:flex;align-items:center;justify-content:center">
                <span class="cd" style="font-weight:700;font-size:19px;color:${c.color}">${c.label}</span>
              </div>`;
    }).join('');
    body = `
<div style="flex:1;display:flex;flex-direction:column;padding:0 22px 14px;min-height:0">
  <div style="padding-top:26px;flex:none">
    <div class="cd kick-a" style="font-weight:700;font-size:13px;letter-spacing:.2em;text-transform:uppercase">Satz ${live.set + 1} von ${ex.sets}</div>
    <div class="cd" style="font-weight:700;font-size:44px;line-height:1;margin-top:6px">${ex.name}</div>
    <div style="font:500 15.5px Barlow,sans-serif;color:rgba(241,240,236,.5);margin-top:6px">${ex.detail}</div>
  </div>

  <div style="flex:1;display:flex;align-items:center;justify-content:center;gap:18px;min-height:0">
    <div class="tap ring stepper" ${act('dec')} style="width:82px;height:82px;border-radius:41px">
      <div class="bar-h"></div>
    </div>
    <div style="flex:1;text-align:center">
      <div class="cd num" style="font-weight:700;font-size:min(118px,26vw);line-height:.85">${live.reps}</div>
      <div class="cd" style="font-weight:600;font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:rgba(241,240,236,.4);margin-top:8px">${ex.unit}</div>
    </div>
    <div class="tap ring stepper" ${act('inc')} style="width:82px;height:82px;border-radius:41px">
      <div class="bar-h"></div><div class="bar-v"></div>
    </div>
  </div>

  <div style="display:flex;gap:8px;margin-bottom:16px;flex:none">${chips}</div>

  <div class="tap press primary" ${act('completeSet')} style="height:86px;border-radius:20px;flex:none">
    <span style="font-size:30px">SATZ FERTIG</span>
  </div>
</div>`;
  }

  return `<div style="flex:1;display:flex;flex-direction:column;min-height:0">${header}${body}</div>`;
}

function viewSheet(){
  if (!S.sheet) return '';
  const slot = curSlots()[S.sheet.i], cur = byId(slot.exId);
  let inner;

  if (S.sheet.type === 'swap') {
    const rank = e => (e.id === cur.id ? -1 : Math.abs(e.lvl - cur.lvl) + (e.equip === cur.equip ? 0 : 0.5));
    const same  = DB.filter(e => e.pattern === cur.pattern).sort((a, b) => rank(a) - rank(b));
    const other = DB.filter(e => e.pattern !== cur.pattern && e.equip === cur.equip).slice(0, 3);

    inner = `
<div style="display:flex;flex-direction:column;min-height:0">
  <div style="flex:none;padding:16px 0 4px">
    <div class="cd kick-a" style="font-weight:700;font-size:12px;letter-spacing:.18em;text-transform:uppercase">${cur.label}</div>
    <div class="cd" style="font-weight:700;font-size:34px;line-height:1.05;margin-top:4px">Übung tauschen</div>
    <div style="font:500 14px/1.4 Barlow,sans-serif;color:rgba(241,240,236,.45);margin-top:4px">Vorausgewählt: gleiches Bewegungsmuster wie ${cur.name}.</div>
  </div>
  <div class="scroll" style="padding:14px 0 4px;display:flex;flex-direction:column;gap:8px">
    ${same.map(e => {
      const isCur = e.id === cur.id;
      const badge = isCur ? 'Aktuell' : (Math.abs(e.lvl - cur.lvl) <= 1 ? 'Ähnlich' : '');
      return `
    <div class="tap" ${act('pickEx', e.id)} style="border:1px solid ${isCur ? 'rgba(255,77,23,.45)' : 'rgba(255,255,255,.09)'};background:${isCur ? 'rgba(255,77,23,.08)' : 'transparent'};border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:12px;flex:none">
      <div style="flex:1;min-width:0">
        <div style="font:600 16px/1.25 Barlow,sans-serif;color:#F1F0EC">${e.name}</div>
        <div style="font:500 13px/1.35 Barlow,sans-serif;color:rgba(241,240,236,.42);margin-top:2px">${e.equip} · ${e.cue}</div>
      </div>
      ${badge ? `<div style="flex:none;padding:4px 9px;border-radius:7px;background:${isCur ? ACCENT : 'rgba(255,77,23,.14)'}">
        <span class="cd" style="font-weight:700;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:${isCur ? '#0F1110' : ACCENT}">${badge}</span>
      </div>` : ''}
    </div>`;
    }).join('')}
    <div class="cd" style="font-weight:700;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:rgba(241,240,236,.35);padding:10px 2px 2px;flex:none">Anderes Muster, gleiches Gerät</div>
    ${other.map(e => `
    <div class="tap" ${act('pickEx', e.id)} style="border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:12px 16px;display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex:none">
      <div style="font:500 15px Barlow,sans-serif;color:rgba(241,240,236,.72)">${e.name}</div>
      <div style="font:500 12.5px Barlow,sans-serif;color:rgba(241,240,236,.35)">${e.label}</div>
    </div>`).join('')}
  </div>
</div>`;

  } else {
    const d = S.draft, dex = byId(d.exId), step = dex.step || 1;
    const loadLabel = dex.kind === 'load' ? 'Gewicht' : 'Zusatzlast Rucksack';
    const loadValue = (d.w > 0 || dex.kind === 'load') ? num(d.w) : '0';
    const atTop = d.reps >= d.hi;
    const progNote = !atTop
      ? 'Alle ' + d.sets + ' Sätze mit ' + d.reps + ' Wdh geschafft → nächste Einheit ' + (d.reps + 1) + ' Wdh. Zielbereich ' + range(d) + '.'
      : (d.prog === 'weight'
          ? 'Oberes Ende von ' + range(d) + ' erreicht → nächste Einheit ' + num(Math.round((d.w + step) * 10) / 10) + ' kg bei ' + d.lo + ' Wdh.'
          : (dex.next
              ? 'Oberes Ende von ' + range(d) + ' erreicht → nächste Einheit ' + byId(dex.next).name + ' mit ' + num(byId(dex.next).w || 0) + ' kg bei ' + d.lo + ' Wdh.'
              : 'Oberes Ende von ' + range(d) + ' erreicht. Nächste Stufe von Hand wählen – Übung antippen.'));

    const miniStepper = (action, plus) => `
      <div class="tap" ${act(action)} style="width:44px;height:44px;border-radius:22px;background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;position:relative;flex:none">
        <div style="width:18px;height:3px;border-radius:2px;background:#F1F0EC"></div>
        ${plus ? '<div style="width:3px;height:18px;border-radius:2px;background:#F1F0EC;position:absolute"></div>' : ''}
      </div>`;

    inner = `
<div style="padding:16px 0 0;overflow-y:auto">
  <div class="cd kick-a" style="font-weight:700;font-size:12px;letter-spacing:.18em;text-transform:uppercase">Last anpassen</div>
  <div class="cd" style="font-weight:700;font-size:34px;line-height:1.05;margin-top:4px">${cur.name}</div>

  <div style="margin-top:20px;display:flex;align-items:center;gap:14px">
    <div class="tap ring stepper" ${act('wDown')} style="width:64px;height:64px;border-radius:32px">
      <div style="width:24px;height:4px;border-radius:2px;background:#F1F0EC"></div>
    </div>
    <div style="flex:1;text-align:center">
      <div class="cd" style="font-weight:700;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:rgba(241,240,236,.4)">${loadLabel}</div>
      <div style="display:flex;align-items:baseline;justify-content:center;gap:6px;margin-top:2px">
        <span class="cd num" style="font-weight:700;font-size:62px;line-height:1">${loadValue}</span>
        <span class="cd" style="font-weight:600;font-size:22px;color:rgba(241,240,236,.5)">kg</span>
      </div>
      <div style="font:500 12px Barlow,sans-serif;color:rgba(241,240,236,.32);margin-top:2px">± ${String(step).replace('.', ',')} kg</div>
    </div>
    <div class="tap ring stepper" ${act('wUp')} style="width:64px;height:64px;border-radius:32px">
      <div style="width:24px;height:4px;border-radius:2px;background:#F1F0EC"></div>
      <div style="width:4px;height:24px;border-radius:2px;background:#F1F0EC;position:absolute"></div>
    </div>
  </div>

  <div style="display:flex;gap:10px;margin-top:18px">
    <div style="flex:1;border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:12px 14px">
      <div class="cd" style="font-weight:700;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:rgba(241,240,236,.4)">Sätze</div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-top:6px">
        ${miniStepper('setsDown', false)}
        <span class="cd num" style="font-weight:700;font-size:32px;line-height:1">${d.sets}</span>
        ${miniStepper('setsUp', true)}
      </div>
    </div>
    <div style="flex:1;border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:12px 14px">
      <div class="cd" style="font-weight:700;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:rgba(241,240,236,.4)">Ziel · Bereich ${range(d)}</div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-top:6px">
        ${miniStepper('repsDown', false)}
        <span class="cd num" style="font-weight:700;font-size:32px;line-height:1">${d.reps}</span>
        ${miniStepper('repsUp', true)}
      </div>
    </div>
  </div>

  <div style="margin-top:18px">
    <div class="cd" style="font-weight:700;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:rgba(241,240,236,.4)">Am oberen Ende steigern über</div>
    <div style="display:flex;gap:8px;margin-top:8px">
      <div class="tap" ${act('setProgWeight')} style="flex:1;height:46px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:${d.prog === 'weight' ? ACCENT : 'transparent'};display:flex;align-items:center;justify-content:center">
        <span class="cd" style="font-weight:700;font-size:16px;letter-spacing:.1em;text-transform:uppercase;color:${d.prog === 'weight' ? '#0F1110' : 'rgba(241,240,236,.6)'}">Gewicht</span>
      </div>
      <div class="tap" ${act('setProgReps')} style="flex:1;height:46px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:${d.prog === 'reps' ? ACCENT : 'transparent'};display:flex;align-items:center;justify-content:center">
        <span class="cd" style="font-weight:700;font-size:16px;letter-spacing:.1em;text-transform:uppercase;color:${d.prog === 'reps' ? '#0F1110' : 'rgba(241,240,236,.6)'}">Wiederholungen</span>
      </div>
    </div>
    <div style="font:500 13px/1.45 Barlow,sans-serif;color:rgba(241,240,236,.45);margin-top:9px">${progNote}</div>
  </div>

  <div class="tap press primary" ${act('applyDraft')} style="height:66px;margin-top:18px">
    <span style="font-size:24px">ÜBERNEHMEN</span>
  </div>
</div>`;
  }

  return `
<div style="position:absolute;left:0;right:0;top:0;bottom:0;background:rgba(5,6,5,.72);display:flex;flex-direction:column;justify-content:flex-end;z-index:50">
  <div class="tap" ${act('closeSheet')} style="flex:1"></div>
  <div style="background:#191C19;border-top:1px solid rgba(255,255,255,.1);border-radius:26px 26px 0 0;padding:14px 20px calc(18px + env(safe-area-inset-bottom));max-height:82dvh;display:flex;flex-direction:column">
    <div style="width:44px;height:4px;border-radius:2px;background:rgba(255,255,255,.22);align-self:center;flex:none"></div>
    ${inner}
  </div>
</div>`;
}

function render(){
  const app = document.getElementById('app');
  const prev = app.querySelector('.scroll');
  if (prev && prev.dataset.key) scrollMemo[prev.dataset.key] = prev.scrollTop;

  const key = screenKey();
  const main = S.live
    ? viewLive()
    : `<div style="flex:1;display:flex;flex-direction:column;min-height:0">
         <div class="scroll" data-key="${key}">${
           S.tab === 'heute' ? viewHeute() : S.tab === 'plan' ? viewPlan() : viewFortschritt()
         }</div>
         ${viewTabs()}
       </div>`;

  app.innerHTML = main + viewSheet();

  const next = app.querySelector('.scroll[data-key]');
  if (next) next.scrollTop = scrollMemo[key] || 0;
}

/* ── Eingabe ──────────────────────────────────────────────── */
document.getElementById('app').addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const fn = A[el.dataset.act];
  if (!fn) return;
  e.preventDefault();
  const arg = el.dataset.arg;
  fn(arg === undefined ? undefined : (/^\d+$/.test(arg) ? Number(arg) : arg));
});

/* Android-Zurück-Taste: schließt Sheet bzw. verlässt das Training,
   statt die Seite zu verlassen. */
history.replaceState({ gf:0 }, '');
history.pushState({ gf:1 }, '');
window.addEventListener('popstate', () => {
  history.pushState({ gf:1 }, '');
  if (S.sheet)      A.closeSheet();
  else if (S.live)  A.abort();
  else if (S.tab !== 'heute') A.goHeute();
});

/* Doppeltipp-Zoom unterbinden – bei nassen Händen sonst nervig. */
let lastTouch = 0;
document.addEventListener('touchend', e => {
  const now = Date.now();
  if (now - lastTouch < 300) e.preventDefault();
  lastTouch = now;
}, { passive:false });

restore();
if (S.live) acquireWakeLock();
render();
</script>
</body>
</html>
